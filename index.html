<!doctype html><html lang="bn"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#164a9c"><title>Cricket Stats</title><style>
*{box-sizing:border-box}body{margin:0;font-family:Arial,"Noto Sans Bengali",sans-serif;background:#f1f4f8;color:#142033}header{background:#164a9c;color:#fff;text-align:center;padding:18px 10px}header h1{margin:0;font-size:26px}header p{margin:5px 0 0}.nav{background:#fff;padding:10px;display:flex;gap:8px;flex-wrap:wrap}.nav button{width:auto;background:#e7edf7;color:#123;border-radius:22px}.nav button.active{background:#164a9c;color:#fff}.wrap{max-width:1100px;margin:auto;padding:14px}.card{background:#fff;border-radius:14px;padding:16px;margin-bottom:14px;box-shadow:0 2px 12px #0001}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:9px}input,select,button{font:inherit;padding:10px;border:1px solid #ccd5e2;border-radius:9px;width:100%}button{background:#164a9c;color:#fff;border:0;font-weight:700;cursor:pointer}.danger{background:#b42318}.muted{color:#657286}.hide{display:none}.scroll{overflow:auto}table{border-collapse:collapse;width:100%;min-width:950px}th,td{border:1px solid #d7dee8;padding:8px;text-align:center}th{background:#e8eef7}.players{display:grid;grid-template-columns:repeat(2,minmax(360px,1fr));gap:14px}.player{background:#edf3ff;border-radius:14px;padding:12px;display:grid;grid-template-columns:170px 1fr;gap:14px;align-items:stretch;min-height:190px}.playerPhotoWrap{display:flex;align-items:center;justify-content:center}.playerPhoto{width:190px;height:230px;border-radius:12px;object-fit:contain;object-position:center;border:2px solid #fff;image-rendering:auto;box-shadow:0 2px 8px #0002;background:#dce6f5}.playerInfo{min-width:0}.playerHead{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:8px}.playerHead h3{margin:0;font-size:21px;color:#123b78}.playerStats{display:grid;grid-template-columns:1fr 1fr;gap:6px 12px;font-size:14px}.playerStats div{padding:4px 0}.photoBox{margin-top:12px;padding:10px;background:#f7f9fc;border-radius:10px}.photoPreview{display:flex;align-items:center;gap:10px;margin-top:8px}.photoPreview img{width:90px;height:90px;border-radius:10px;object-fit:cover;border:2px solid #ccd5e2}.photoBox{margin-top:12px;padding:10px;background:#f7f9fc;border-radius:10px}.photoPreview{display:flex;align-items:center;gap:10px;margin-top:8px}.photoPreview img{width:60px;height:60px;border-radius:50%;object-fit:cover;border:2px solid #ccd5e2}.msg{margin-top:10px;font-weight:700}.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}@media(max-width:900px){.players{grid-template-columns:1fr}}@media(max-width:600px){.two{grid-template-columns:1fr}.player{grid-template-columns:120px 1fr;gap:10px}.playerPhoto{width:140px;height:180px}.playerStats{grid-template-columns:1fr;font-size:13px}header h1{font-size:22px}}
</style></head><body><header><h1>🏏 Cricket Stats</h1><p>সকল খেলোয়াড়ের আপডেটেড পরিসংখ্যান</p></header><div class="nav"><button id="homeBtn" class="active" onclick="show('home')">Home</button><button id="playersBtn" onclick="show('players')">Players</button><button id="adminBtn" onclick="show('admin')">Admin</button></div><div class="wrap">
<section id="home"><div class="card"><h2>Players</h2><div id="cards" class="players"><div class="muted">লোড হচ্ছে...</div></div></div></section>
<section id="players" class="hide"><div class="card"><h2>📊 সব Stats</h2><div class="scroll"><table><thead><tr><th>Player</th><th>Match</th><th>Won</th><th>Lost</th><th>Win Rate</th><th>Run</th><th>Run Avg</th><th>Wicket</th><th>Wicket Avg</th><th>50</th><th>100</th></tr></thead><tbody id="stats"></tbody></table></div></div></section>
<section id="admin" class="hide"><div id="login" class="card"><h2>🔐 Admin Login</h2><input id="pin" type="password" placeholder="Admin PIN"><br><br><button onclick="login()">Login</button><div id="loginMsg" class="msg"></div></div><div id="panel" class="hide">
<div class="card"><h2>➕ নতুন ম্যাচ যোগ</h2><div class="grid"><select id="player"></select><input id="match" type="number" value="1" placeholder="Match"><input id="won" type="number" value="0" placeholder="Won"><input id="lost" type="number" value="0" placeholder="Lost"><input id="run" type="number" value="0" placeholder="Run"><input id="wicket" type="number" value="0" placeholder="Wicket"><input id="fifty" type="number" value="0" placeholder="50"><input id="hundred" type="number" value="0" placeholder="100"></div><br><button onclick="saveMatch()">Save Match</button><div id="saveMsg" class="msg"></div></div>
<div class="card"><h2>👤 Player-এর ছবি</h2><select id="managePlayer" onchange="loadManagePhoto()"></select><div class="photoBox"><label>একজন Player বেছে ছবি দিন</label><input id="managePhoto" type="file" accept="image/*" onchange="previewManagePhoto()"><div id="managePhotoPreview" class="photoPreview"></div><br><button onclick="savePlayerPhoto()">ছবি সেভ করুন</button></div><div id="manageMsg" class="msg"></div></div><div class="card"><h2>👤 Player যোগ / মুছুন</h2><input id="newPlayer" placeholder="নতুন Player নাম"><br><br><button onclick="addPlayer()">Player যোগ করুন</button><br><br><button class="danger" onclick="deletePlayer()">Selected Player মুছে দিন</button><br><br><button class="danger" onclick="resetPlayer()">Selected Player-এর সব Stats Reset</button></div>
</div></section></div><script>
const API='https://script.google.com/macros/s/AKfycbxCSeH5OjhjT5AoLZQEmtdE-gYf1hqetebhgZWrdBzFWGrD5sRVm_8h66N7x_mzLXTn/exec';let DATA={players:[]},PIN='';
function show(id){['home','players','admin'].forEach(x=>document.getElementById(x).classList.toggle('hide',x!==id));['homeBtn','playersBtn','adminBtn'].forEach(x=>document.getElementById(x).classList.remove('active'));document.getElementById(id+'Btn').classList.add('active');}
function api(params,cb){const s=document.createElement('script');const c='cb'+Date.now()+Math.floor(Math.random()*10000);params.api='1';params.callback=c;window[c]=(x)=>{delete window[c];s.remove();cb(x)};s.src=API+'?'+new URLSearchParams(params).toString();s.onerror=()=>{delete window[c];s.remove();cb({ok:false,error:'Backend connection failed'})};document.body.appendChild(s)}
function load(cb){api({action:'get'},x=>{if(!x.ok){document.getElementById('cards').innerHTML='<div>Backend সংযোগ হচ্ছে না। Apps Script deployment ঠিক আছে কি না দেখুন।</div>';if(cb)cb(false,x);return}DATA=x;render();if(cb)cb(true,x)})}
function render(){
document.getElementById('cards').innerHTML=DATA.players.map(p=>`
<div class="player">
  <div class="playerPhotoWrap">
    <img class="playerPhoto" src="${photoSrc(p.photo,p.name)}" alt="${esc(p.name)}" loading="eager" decoding="auto" referrerpolicy="no-referrer">
  </div>
  <div class="playerInfo">
    <div class="playerHead"><h3>${esc(p.name)}</h3></div>
    <div class="playerStats">
      <div>🏆 Match: ${p.match}</div><div>✅ Win: ${p.won}</div><div>❌ Lost: ${p.lost}</div><div>🏃 Run: ${p.run}</div>
      <div>📈 Win Rate: ${p.match?(p.won/p.match*100).toFixed(1):'0.0'}%</div><div>🏏 Batting Average: ${p.match?(p.run/p.match).toFixed(2):'0.00'}</div>
      <div>🎯 Wicket Average: ${p.match?(p.wicket/p.match).toFixed(2):'0.00'}</div><div>⚾ Wicket: ${p.wicket}</div><div>⭐ 50: ${p.fifty}</div><div>⭐ 100: ${p.hundred}</div>
    </div>
  </div>
</div>`).join('');
document.getElementById('stats').innerHTML=DATA.players.map(p=>`<tr><td><b>${esc(p.name)}</b></td><td>${p.match}</td><td>${p.won}</td><td>${p.lost}</td><td>${p.match?(p.won/p.match*100).toFixed(2):'0.00'}%</td><td>${p.run}</td><td>${p.match?(p.run/p.match).toFixed(2):'0.00'}</td><td>${p.wicket}</td><td>${p.match?(p.wicket/p.match).toFixed(2):'0.00'}</td><td>${p.fifty}</td><td>${p.hundred}</td></tr>`).join('');
const opts=DATA.players.map(p=>`<option>${esc(p.name)}</option>`).join('');document.getElementById('player').innerHTML=opts;document.getElementById('managePlayer').innerHTML=opts;if(DATA.players.length)loadManagePhoto()
}
function login(){const p=document.getElementById('pin').value.trim();if(!p){document.getElementById('loginMsg').textContent='Admin PIN দিন';return}api({action:'checkPin',pin:p},x=>{if(x.ok){PIN=p;document.getElementById('login').classList.add('hide');document.getElementById('panel').classList.remove('hide');document.getElementById('loginMsg').textContent=''}else document.getElementById('loginMsg').textContent=x.error||'ভুল Admin PIN'})}
function n(id){return Number(document.getElementById(id).value)||0}
function saveMatch(){api({action:'save',pin:PIN,player:document.getElementById('player').value,match:n('match'),won:n('won'),lost:n('lost'),run:n('run'),wicket:n('wicket'),fifty:n('fifty'),hundred:n('hundred')},done('saveMsg'))}
function addPlayer(){
const name=document.getElementById('newPlayer').value.trim(); const file=document.getElementById('newPhoto').files[0];
if(!name){document.getElementById('manageMsg').textContent='Player name দিন';return}
if(file&&file.size>8388608){document.getElementById('manageMsg').textContent='ছবিটি 8MB-এর বেশি। 8MB-এর মধ্যে ছবি দিন';return}
const finish=()=>{document.getElementById('manageMsg').textContent='Player যোগ হয়েছে ✅';document.getElementById('newPlayer').value='';document.getElementById('newPhoto').value='';load()};
api({action:'addPlayer',pin:PIN,name:name},x=>{if(!x.ok){document.getElementById('manageMsg').textContent=x.error||'সমস্যা হয়েছে';return}DATA=x;if(file){imageToDataUrl(file).then(photo=>savePhotoPost(name,photo,finish))}else finish()});
}
function photoSrc(photo,name){if(photo){return photo+(photo.indexOf('?')>=0?'&':'?')+'v='+Date.now()}return 'data:image/svg+xml;charset=UTF-8,'+encodeURIComponent('<svg xmlns="http://www.w3.org/2000/svg" width="120" height="120"><rect width="120" height="120" fill="#dce6f5"/><text x="60" y="68" text-anchor="middle" font-size="44" fill="#164a9c">'+String(name||'?').charAt(0).toUpperCase()+'</text></svg>')}
function imageToDataUrl(file){return new Promise(resolve=>{if(!file){resolve('');return}const r=new FileReader();r.onload=()=>resolve(r.result);r.onerror=()=>resolve('');r.readAsDataURL(file)})}
function previewManagePhoto(){const f=document.getElementById('managePhoto').files[0];const box=document.getElementById('managePhotoPreview');if(!f){loadManagePhoto();return}const r=new FileReader();r.onload=()=>box.innerHTML='<img src="'+r.result+'" alt="new preview"><span>ছবি নির্বাচিত</span>';r.readAsDataURL(f)}
function loadManagePhoto(){const p=DATA.players.find(x=>x.name===document.getElementById('managePlayer').value);document.getElementById('managePhotoPreview').innerHTML=p&&p.photo?'<img src="'+p.photo+(p.photo.indexOf('?')>=0?'&':'?')+'preview='+Date.now()+'" alt="photo" referrerpolicy="no-referrer">':'<span>ছবি নেই</span>'}
async function savePlayerPhoto(){
const name=document.getElementById('managePlayer').value;const file=document.getElementById('managePhoto').files[0];
if(!name){document.getElementById('manageMsg').textContent='Player নির্বাচন করুন';return}
if(!file){document.getElementById('manageMsg').textContent='ছবি নির্বাচন করুন';return}
if(file.size>8388608){document.getElementById('manageMsg').textContent='ছবিটি 8MB-এর বেশি। 8MB-এর মধ্যে ছবি দিন';return}
document.getElementById('manageMsg').textContent='ছবি সেভ হচ্ছে...';const photo=await imageToDataUrl(file);if(!photo){document.getElementById('manageMsg').textContent='ছবি পড়তে সমস্যা হয়েছে';return}
const old=(DATA.players.find(x=>x.name===name)||{}).photo||'';savePhotoPost(name,photo,()=>{document.getElementById('managePhoto').value='';document.getElementById('manageMsg').textContent='ছবি পরিবর্তন হয়েছে ✅';loadManagePhoto()});
}
function savePhotoPost(name,photo,success){
const msg=document.getElementById('manageMsg');msg.textContent='ছবি সেভ হচ্ছে...';
const iframe=document.createElement('iframe');iframe.name='photoFrame_'+Date.now();iframe.style.display='none';document.body.appendChild(iframe);
const form=document.createElement('form');form.method='POST';form.action=API;form.target=iframe.name;form.style.display='none';
function add(k,v){const i=document.createElement('input');i.type='hidden';i.name=k;i.value=v;form.appendChild(i)}
add('action','updatePhoto');add('pin',PIN);add('name',name);add('photo',photo);document.body.appendChild(form);form.submit();
let tries=0;const check=()=>{tries++;load((ok,x)=>{if(ok){const p=x.players.find(q=>q.name===name);if(p&&p.photo){msg.textContent='ছবি পরিবর্তন হয়েছে ✅';if(success)success();cleanup();return}}if(tries<12)setTimeout(check,1500);else{msg.textContent='ছবি সেভ নিশ্চিত করা যায়নি। আবার চেষ্টা করুন।';cleanup()}})};setTimeout(check,1800);
function cleanup(){try{iframe.remove();form.remove()}catch(e){}}
}
function deletePlayer(){if(!confirm('এই Player সম্পূর্ণ মুছে ফেলবেন?'))return;api({action:'deletePlayer',pin:PIN,name:document.getElementById('managePlayer').value},done('manageMsg'))}
function resetPlayer(){if(!confirm('এই Player-এর সব Stats 0 করে দেবেন?'))return;api({action:'resetPlayer',pin:PIN,name:document.getElementById('managePlayer').value},done('manageMsg'))}
function done(id){return x=>{document.getElementById(id).textContent=x.ok?(x.message||'হয়ে গেছে ✅'):x.error;if(x.ok){DATA=x;render()}}}
function esc(s){return String(s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
load();
</script></body></html>
